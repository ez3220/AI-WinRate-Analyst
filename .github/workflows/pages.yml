name: Deploy iPhone Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and prepare V2 site
        run: |
          set -e
          test -s app-v2.html
          test -s manifest.json
          mkdir -p _site
          cp app-v2.html _site/index.html
          cp manifest.json _site/manifest.json
          touch _site/.nojekyll
          echo "V2 files deployed:"
          find _site -maxdepth 1 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
