name: V4 live sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: v4-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
        working-directory: backend

      - name: Bootstrap database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python init_db.py
        working-directory: backend

      - name: Run live sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MLB_API_KEY: ${{ secrets.MLB_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          MLB_BASE_URL: ${{ secrets.MLB_BASE_URL }}
          ODDS_BASE_URL: ${{ secrets.ODDS_BASE_URL }}
          WEATHER_BASE_URL: ${{ secrets.WEATHER_BASE_URL }}
        run: python -c "from live_sync import run_live_sync; print(run_live_sync())"
        working-directory: backend
