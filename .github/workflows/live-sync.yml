name: V4 live data sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: v4-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

      - name: Bootstrap PostgreSQL schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python init_db.py
        working-directory: backend

      - name: Sync MLB games, pitchers, odds, stats and weather
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MLB_BASE_URL: ${{ secrets.MLB_BASE_URL }}
          ODDS_BASE_URL: ${{ secrets.ODDS_BASE_URL }}
          WEATHER_BASE_URL: ${{ secrets.WEATHER_BASE_URL }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
        run: python -c "from live_sync import run_live_sync; print(run_live_sync())"
        working-directory: backend

      - name: Rebuild daily predictions and Top3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from live_sync import taipei_game_date; from prediction_service import prediction_report; print(prediction_report(taipei_game_date()))"
        working-directory: backend
