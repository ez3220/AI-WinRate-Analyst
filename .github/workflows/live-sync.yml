name: V4 live odds sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: v4-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Bootstrap database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python init_db.py
        working-directory: backend
      - name: Fetch and persist live MLB odds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BASE_URL: ${{ secrets.ODDS_BASE_URL }}
          ODDS_REGIONS: us
        run: python -c "from live_odds_sync import run_odds_sync; print(run_odds_sync())"
        working-directory: backend
