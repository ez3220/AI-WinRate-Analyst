<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI WinRate Analyst — V4 測試模式</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}main{max-width:760px;margin:auto}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px;margin:12px 0}h1{font-size:24px}h2{font-size:18px}label{display:block;margin:10px 0 4px;color:#8b949e}input{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;font-size:16px}button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:9px;background:#238636;color:#fff;font-size:16px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{font-size:25px;font-weight:700}.muted{color:#8b949e}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#30363d;font-weight:700}.bet{background:#238636}.lean{background:#9e6a03}.no{background:#6e7681}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>⚾ AI WinRate Analyst</h1><div class="card"><span class="badge">V4 測試模式</span><p class="muted">手動輸入資料，不連接真實 API。用於先驗證模型與操作流程。</p><div class="grid"><section><h2>客隊</h2><label>先發 ERA</label><input id="ae" type="number" step="0.01" value="3.50"><label>WHIP</label><input id="aw" type="number" step="0.01" value="1.15"><label>OPS</label><input id="ao" type="number" step="0.001" value="0.750"><label>得分/場</label><input id="ar" type="number" step="0.1" value="4.5"><label>牛棚 0–100</label><input id="ab" type="number" value="75"><label>打線 0–100</label><input id="al" type="number" value="75"></section><section><h2>主隊</h2><label>先發 ERA</label><input id="he" type="number" step="0.01" value="4.20"><label>WHIP</label><input id="hw" type="number" step="0.01" value="1.30"><label>OPS</label><input id="ho" type="number" step="0.001" value="0.710"><label>得分/場</label><input id="hr" type="number" step="0.1" value="4.1"><label>牛棚 0–100</label><input id="hb" type="number" value="65"><label>打線 0–100</label><input id="hl" type="number" value="68"></section></div><label>客隊十進制賠率（沒有就留空）</label><input id="od" type="number" step="0.01" placeholder="例如 2.10"><label>大小分盤（可留空）</label><input id="tot" type="number" step="0.5" placeholder="例如 8.5"><button onclick="run()">開始 V4 分析</button></div><div id="out" class="card" style="display:none"></div></main><script>const n=id=>{const v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)?v:null};function run(){const ae=n('ae'),aw=n('aw'),ao=n('ao'),ar=n('ar'),ab=n('ab'),al=n('al'),he=n('he'),hw=n('hw'),ho=n('ho'),hr=n('hr'),hb=n('hb'),hl=n('hl'),od=n('od'),tot=n('tot');let away=0,home=0;away+=(5-Math.min(ae,5))*8;home+=(5-Math.min(he,5))*8;away+=(2-Math.max(aw-1,0))*12;home+=(2-Math.max(hw-1,0))*12;away+=(ao-.700)*120;home+=(ho-.700)*120;away+=(ar-4)*10+(ab-60)*.15+(al-60)*.15;home+=(hr-4)*10+(hb-60)*.15+(hl-60)*.15;const raw=1/(1+Math.exp(-(away-home)/12));const p=Math.max(.05,Math.min(.95,raw));const market=od&&od>1?1/od:null;const edge=market!==null?p-market:null;const ev=od&&od>1?p*od-1:null;let decision='NO BET',cls='no';if(ev!==null&&ev>=.05){decision='BET';cls='bet'}else if(edge!==null&&edge>=.025){decision='LEAN';cls='lean'}const projected=Math.max(0.5,ar*(1+(5-he)*.06)+hr*(1+(5-ae)*.06)+(ab+hb-120)*.008);const totalText=tot?`${projected.toFixed(2)} vs ${tot} → ${projected>tot?'OVER':'UNDER'}`:`預估總分 ${projected.toFixed(2)}`;document.getElementById('out').style.display='block';document.getElementById('out').innerHTML=`<h2>V4 分析結果</h2><div class="grid"><div><span class="muted">客隊模型勝率</span><div class="metric">${(p*100).toFixed(1)}%</div></div><div><span class="muted">市場隱含機率</span><div class="metric">${market===null?'—':(market*100).toFixed(1)+'%'}</div></div><div><span class="muted">Edge</span><div class="metric">${edge===null?'—':(edge*100).toFixed(1)+'%'}</div></div><div><span class="muted">EV</span><div class="metric">${ev===null?'—':(ev*100).toFixed(1)+'%'}</div></div></div><p><span class="badge ${cls}">${decision}</span></p><p><b>大小分：</b>${totalText}</p><p class="muted">測試模式只代表模型試算，不代表真實盤口、即時資料或保證獲利。</p>`}</script></body></html>
