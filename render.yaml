services:
  - type: web
    name: ai-winrate-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: python init_db.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-winrate-db
          property: connectionString
      - key: ODDS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ez3220.github.io
      - key: MLB_BASE_URL
        value: https://statsapi.mlb.com/api/v1
      - key: ODDS_BASE_URL
        value: https://api.the-odds-api.com/v4
      - key: WEATHER_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: MLB_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false

databases:
  - name: ai-winrate-db
    plan: free
