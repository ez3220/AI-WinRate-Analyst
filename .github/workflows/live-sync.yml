name: V4 live odds sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: v4-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

      - name: Bootstrap PostgreSQL schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python init_db.py
        working-directory: backend

      - name: Fetch and persist live MLB odds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BASE_URL: ${{ secrets.ODDS_BASE_URL }}
          ODDS_REGIONS: us
        run: python -c "from live_odds_sync import run_odds_sync; print(run_odds_sync())"
        working-directory: backend
