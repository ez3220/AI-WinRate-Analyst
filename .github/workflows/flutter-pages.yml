name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci
  cancel-in-progress: true

env:
  FLUTTER_BASE_HREF: /${{ github.event.repository.name }}/
  DEFAULT_API_BASE_URL: https://ai-winrate-backend.onrender.com

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Test backend
        run: pytest -q backend

      - name: Validate backend Python syntax
        run: python -m compileall -q backend

      - name: Build backend container
        run: docker build -t ai-winrate-backend:ci backend

      - name: Select production API URL
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL_SECRET:-$DEFAULT_API_BASE_URL}"
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *) echo "API_BASE_URL must be an absolute HTTP(S) URL"; exit 1 ;;
          esac
          case "$API_BASE_URL" in
            *localhost*|*127.0.0.1*) echo "Production API_BASE_URL cannot point to localhost"; exit 1 ;;
          esac
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Build Flutter web
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "$FLUTTER_BASE_HREF" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload Flutter web build for validation
        uses: actions/upload-artifact@v4
        with:
          name: ai-winrate-analyst-flutter-web
          path: build/web
          if-no-files-found: error
          retention-days: 7
